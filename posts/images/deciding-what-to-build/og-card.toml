# OG-card brief for posts/2026-11-10-deciding-what-to-build.md.
#
# Render:
#     uv run tooling/render-og-card.py posts/images/deciding-what-to-build/og-card.toml

[card]
title = ["Deciding What to Build", "Isn't Easier with Agents"]
subhead = "Agents made features cheap to build. They didn't make it cheaper to decide which ones are worth it."
series_mark = "A Cross-Functional Team of One"

[[panel]]
label = "At the merge gate"
sublabel = "every technical check passed"
mono = true
rows = [
  ["does it work?", "yes"],
  ["meets its ACs?", "every one"],
  ["who benefits?", "not asked"],
  ["in real configs", "not checked"],
  ["outcome", "ready to merge"],
]

[[panel]]
label = "After the value review"
sublabel = "asked who it's for"
mono = true
rows = [
  ["does it work?", "yes"],
  ["meets its ACs?", "every one"],
  ["who benefits?", "none found"],
  ["in real configs", "0 instances"],
  ["outcome", "closed unmerged"],
]
